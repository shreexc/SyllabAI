services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syllabai
      POSTGRES_USER: syllabai
      POSTGRES_PASSWORD: syllabai
    ports:
      - "5433:5432"
    volumes:
      - syllabai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllabai -d syllabai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syllabai-postgres:
